name: trigger3
on:
  schedule:
    - cron: '13 3 * * 1-5'   # 8:43 IST  (part 1, till 12:40)
    - cron: '47 6 * * 1-5'   # 12:17 IST (part 2, till 15:35)
  workflow_dispatch:
    inputs:
      test:
        description: 'Test only? (yes/no)'
        default: 'yes'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install smartapi-python pyotp pandas numpy requests logzero websocket-client
      - name: Run bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PIN: ${{ secrets.PIN }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHED: ${{ github.event.schedule }}
          TEST: ${{ github.event.inputs.test }}
        run: python trigger3_bot.py
