name: trigger3
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Mode'
        type: choice
        options:
          - 'no'
          - 'p1'
          - 'p2'
          - 'yes'
          - 'replay'
          - 'backtest'
        default: 'no'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install smartapi-python pyotp pandas numpy requests logzero websocket-client
      - name: Run bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PIN: ${{ secrets.PIN }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
        run: python trigger3_bot.py
